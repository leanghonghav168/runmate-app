# Rate limiting zone: 10MB memory, 30 requests per second per IP
limit_req_zone $binary_remote_addr zone=runmate_api_limit:10m rate=30r/s;

upstream runmate_backend {
    server 127.0.0.1:3333;
    keepalive 64;
}

# HTTP — Redirect all plaintext traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.runmate.app app.runmate.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Production Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.runmate.app app.runmate.app;

    # SSL / TLS Certificates (Managed by Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.runmate.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.runmate.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Buffer & Body Size (Supports large GPS trail uploads)
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/x-javascript;

    # NestJS REST API Reverse Proxy
    location /api/ {
        limit_req zone=runmate_api_limit burst=50 nodelay;

        proxy_pass http://runmate_backend;
        proxy_http_version 1.1;

        # WebSocket & Connection upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for background sync
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static Web App / Capacitor Assets
    location / {
        root /var/www/runmate/mobile/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static chunks
        location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}

