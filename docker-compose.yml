services:
  # ===================================================
  # PostgreSQL Database Service
  # ===================================================
  postgres:
    image: postgres:17-alpine
    container_name: runmate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-runmate}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - runmate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - runmate-network

  # ===================================================
  # NestJS Production Backend API Service
  # ===================================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: runmate-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-runmate}?schema=public
      JWT_SECRET: ${JWT_SECRET:-runmate-production-jwt-access-secret-replace-me}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-runmate-production-jwt-refresh-secret-replace-me}
      JWT_REFRESH_EXPIRES_IN: 7d
    ports:
      - "3333:3333"
    networks:
      - runmate-network

networks:
  runmate-network:
    driver: bridge

volumes:
  runmate_pgdata:
    driver: local

